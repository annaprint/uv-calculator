# /etc/nginx/sites-available/calc.citi-print.ru
# Bootstrap config: HTTP only. Run `certbot --nginx -d calc.citi-print.ru`
# AFTER install.sh and the DNS A-record is live; certbot will add the
# 443/SSL server block, ssl_certificate directives, and the 80→443 redirect.

server {
    listen 80;
    server_name calc.citi-print.ru;

    client_max_body_size 5m;

    # Hardening headers (re-applied by certbot to the SSL block too)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The login_zone shared memory is defined at http{} level in
    # /etc/nginx/conf.d/uv-calc-limits.conf (installed by install.sh).
    location /api/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
