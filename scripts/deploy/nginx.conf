# /etc/nginx/sites-available/calc.citi-print.ru
# After install.sh: run `certbot --nginx -d calc.citi-print.ru` to inject
# ssl_certificate / ssl_certificate_key directives and redirect upgrades.

server {
    listen 80;
    server_name calc.citi-print.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name calc.citi-print.ru;

    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/calc.citi-print.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/calc.citi-print.ru/privkey.pem;

    client_max_body_size 5m;

    # Front-line login throttling (the app also rate-limits at express level).
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    location /api/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
